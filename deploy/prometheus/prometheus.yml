global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: cerberus
    static_configs:
      # `make run` serves the engine on the host; inside compose it is reached
      # through the gateway alias.
      - targets: ["host.docker.internal:8080"]

  # JetStream depth and consumer lag, by way of the exporter: NATS itself
  # serves /varz and /jsz, not Prometheus text.
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
